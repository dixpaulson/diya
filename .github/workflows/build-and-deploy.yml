# Checks every pull request, and publishes the web app to GitHub Pages
# (the gh-pages branch) whenever main changes.
name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The version the app was built and tested with; see .metadata.
  FLUTTER_VERSION: 3.44.6

jobs:
  check:
    name: Analyze, test, build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /diya/

  deploy:
    name: Publish to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build web --release --base-href /diya/
      - uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
      - name: Replace the site with the new build
        working-directory: gh-pages
        run: |
          git rm -rq .
          cp -r ../build/web/. .
          git add -A
          if git diff --cached --quiet; then
            echo "The site is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Deploy Diya web build from ${GITHUB_SHA::7}"
          git push
